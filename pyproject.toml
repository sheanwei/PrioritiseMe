[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskbot"
version = "0.1.0"
description = "Personal intake gate for ad-hoc work"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.40",
  "mcp>=1.2",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["taskbot*"]

[tool.setuptools.package-data]
taskbot = ["static/**/*", "slices/*/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "taskbot/slices"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
